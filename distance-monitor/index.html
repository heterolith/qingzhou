<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f8f9fb">
<title>距离监测仪 · 控制</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/common.css">
</head>
<!-- data-page 供 common.js 的 highlightNav() 识别当前页 -->
<body data-page="control">

  <header class="top-bar">
    <button class="icon-btn left"><i class="fas fa-bars"></i></button>
    <h1><i class="fas fa-ruler-combined brand-icon"></i>距离监测仪</h1>
    <a class="icon-btn right" href="settings.html"><i class="fas fa-gear color"></i></a>
  </header>

  <!-- 固件连接条（输入 ESP8266 IP，连接/断开）-->
  <div class="conn-bar" id="connBar">
    <i class="fas fa-wifi" id="connIcon"></i>
    <input type="text" id="connIP" placeholder="ESP8266 IP (如 192.168.1.50)" class="conn-input">
    <button class="conn-btn" id="connBtn">连接</button>
    <span class="conn-status" id="connStatus">未连接 · 模拟模式</span>
  </div>

  <main class="content">

    <!-- 传感器指示徽章 -->
    <div class="sensor-badge active" id="sensorBadge">
      <i class="fas fa-tower-broadcast"></i>
      <span>超声波传感器</span>
    </div>

    <!-- 状态标题 -->
    <div class="headline ok" id="headline">
      <i class="fas fa-circle-check" id="headlineIcon"></i>
      <span id="headlineText">监测中 · 距离正常</span>
    </div>

    <!-- 仿 OLED 屏幕（对齐固件 SSD1306 128×64，三态显示）-->
    <div class="oled-wrap">
      <div class="oled-screen" id="oledScreen">
        <div class="oled-header">DISTANCE</div>
        <div class="oled-body" id="oledBody">
          <div class="oled-main" id="oledMain">50</div>
          <div class="oled-unit">CM</div>
        </div>
        <div class="oled-bar"><div class="oled-bar-fill" id="oledBarFill" style="width:14px"></div></div>
      </div>
      <div class="oled-caption" id="oledCaption">
        <span class="dot"></span><span id="oledCaptionText">正常 · OLED 实时显示</span>
      </div>
    </div>

    <!-- 量程胶囊条 -->
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="capsule-track">
        <div class="capsule-fill" id="distBar" style="width:12%"></div>
        <div class="threshold-tick" id="thresholdTick"></div>
      </div>
      <div class="capsule-labels"><span>0</span><span id="thLabel">阈值 15cm</span><span>400cm</span></div>
    </div>

    <!-- 模拟物体控制（Web 模拟用，对齐固件测距来源）-->
    <div class="sim-row" id="simModeRow">
      <button class="chip-sm selected" data-mode="wave"><i class="fas fa-wave-square"></i> 波动</button>
      <button class="chip-sm" data-mode="manual"><i class="fas fa-hand-pointer"></i> 手动</button>
      <input type="range" id="simDistSlider" min="2" max="430" step="1" style="display:none">
      <span id="simDistVal" style="font-size:12px;min-width:48px;display:none">50 cm</span>
    </div>

    <!-- 三状态卡 -->
    <section class="status-row">
      <div class="status-card alarm-ok" id="alarmCard">
        <div class="status-icon"><i class="fas fa-circle-check" id="alarmIcon"></i></div>
        <div class="status-title">报警状态</div>
        <div class="status-desc" id="alarmDesc">距离正常</div>
      </div>
      <div class="status-card buzzer-off" id="buzzerCard">
        <div class="status-icon"><i class="fas fa-volume-xmark" id="buzzerIcon"></i></div>
        <div class="status-title">蜂鸣器</div>
        <div class="status-desc" id="buzzerDesc">已静音</div>
      </div>
      <div class="status-card vibrate-on" id="vibrateCard">
        <div class="status-icon"><i class="fas fa-mobile-screen" id="vibrateIcon"></i></div>
        <div class="status-title">震动反馈</div>
        <div class="status-desc" id="vibrateDesc">已启用</div>
      </div>
    </section>

    <!-- 串口日志（对齐固件 Serial.print 输出）-->
    <div class="serial-log" id="serialLog"></div>

    <!-- 操作按钮 -->
    <div class="page-actions">
      <button class="action-btn secondary" id="testBtn"><i class="fas fa-bullhorn"></i>测试蜂鸣</button>
      <button class="action-btn secondary" id="testVibBtn"><i class="fas fa-mobile-screen"></i>测试震动</button>
    </div>

  </main>

  <!-- 底部导航 -->
  <nav class="nav-bar">
    <a class="nav-item" data-nav="control" href="index.html">
      <div class="nav-icon-wrap"><i class="fas fa-sliders"></i></div><span>控制</span>
    </a>
    <a class="nav-item" data-nav="data" href="data.html">
      <div class="nav-icon-wrap"><i class="fas fa-chart-line"></i></div><span>数据</span>
    </a>
    <a class="nav-item" data-nav="settings" href="settings.html">
      <div class="nav-icon-wrap"><i class="fas fa-gear"></i></div><span>设置</span>
    </a>
  </nav>

<script src="js/firmware.js"></script>
<script src="js/common.js"></script>
<script src="js/connect.js"></script>
<script>
/* ==========================================================
   主页专属逻辑（对齐固件版）
   数据源优先级：连固件 → WebSocket 真实数据；未连 → firmware.js 模拟
   OLED 三态：Invalid / TMP闪烁 / 数值+进度条
   报警/蜂鸣/震动为 Web 增值（固件无）
   ========================================================== */
const settings = loadSettings();
let currentDist = 50;
let currentState = 'normal';

/* ===== 连接 UI 初始化 ===== */
function refreshConnUI() {
  const ip = Conn.loadIP();
  document.getElementById('connIP').value = ip;
  const icon = document.getElementById('connIcon');
  const btn = document.getElementById('connBtn');
  const status = document.getElementById('connStatus');
  const map = {
    [ConnState.OFFLINE]:   { icon: 'fa-wifi',         color: '#72777f', text: '未连接 · 模拟模式',  btn: '连接' },
    [ConnState.CONNECTING]:{ icon: 'fa-spinner',      color: '#00639b', text: '连接中…',           btn: '取消' },
    [ConnState.ONLINE]:    { icon: 'fa-circle-check', color: '#4c651f', text: '已连固件 · 实时数据', btn: '断开' },
    [ConnState.ERROR]:     { icon: 'fa-triangle-exclamation', color: '#ba1a1a', text: '连接失败 · 模拟模式', btn: '连接' },
  };
  const m = map[Conn.state] || map[ConnState.OFFLINE];
  icon.className = 'fas ' + m.icon;
  icon.style.color = m.color;
  btn.textContent = m.btn;
  status.textContent = m.text;
  // 连固件时隐藏模拟控制条
  document.getElementById('simModeRow').style.display =
    Conn.isOnline() ? 'none' : 'flex';
}
Conn.onStateChange = refreshConnUI;
document.addEventListener('conn-state', refreshConnUI);

/* ===== 连接按钮 ===== */
document.getElementById('connBtn').addEventListener('click', () => {
  if (Conn.isOnline() || Conn.state === ConnState.CONNECTING) {
    Conn.disconnect();
  } else {
    const ip = document.getElementById('connIP').value.trim();
    if (ip) Conn.connect(ip, 81);
  }
});

/* ===== 收到固件数据时更新本地（仅用真实数据，不覆盖设置）===== */
Conn.onData((msg) => {
  if (msg.distance != null) {
    currentDist = msg.distance;
    currentState = msg.state || getDistanceState(currentDist);
    updateUI();  // 立即刷新 UI（不等 1 秒 tick）
  }
});

/* ===== 初始化模拟物体（对齐设置页 simMode/simDistance）===== */
setSimMode(settings.simMode);
setSimDistance(settings.simDistance);

/* ===== 滑块进度条着色 ===== */
function paintSlider(el, min, max) {
  const pct = (el.value - min) / (max - min) * 100;
  el.style.setProperty('--fill', pct + '%');
}

/* ===== 传感器徽章（用公共函数，保证与数据页口径一致） ===== */
function refreshSensorBadge() {
  const badge = document.getElementById('sensorBadge');
  const info = getSensorInfo(settings);
  badge.innerHTML = `<i class="fas ${info.icon}"></i><span>${info.name}</span>`;
  badge.classList.toggle('active', !info.off);
}
refreshSensorBadge();

/* ===== 静态元素按设置初始化（阈值刻度等） ===== */
function refreshThresholdUI() {
  document.getElementById('thresholdTick').style.left =
    settings.threshold / MAX_RANGE * 100 + '%';
  document.getElementById('thLabel').textContent = `阈值 ${settings.threshold}cm`;
}
refreshThresholdUI();

/* ===== 初始化模拟控制 UI ===== */
function refreshSimUI() {
  const s = loadSettings();
  document.querySelectorAll('#simModeRow .chip-sm').forEach(c => {
    c.classList.toggle('selected', c.dataset.mode === s.simMode);
  });
  const manual = s.simMode === 'manual';
  document.getElementById('simDistSlider').style.display = manual ? 'block' : 'none';
  document.getElementById('simDistVal').style.display = manual ? 'inline' : 'none';
  const slider = document.getElementById('simDistSlider');
  slider.value = s.simDistance;
  document.getElementById('simDistVal').textContent = s.simDistance + ' cm';
  paintSlider(slider, 2, 430);
}
refreshSimUI();

/* ===== 串口日志（对齐固件 Serial.print）===== */
function appendSerial(d) {
  const log = document.getElementById('serialLog');
  const line = document.createElement('div');
  line.className = 'line';
  const ts = new Date();
  const hh = String(ts.getHours()).padStart(2, '0');
  const mm = String(ts.getMinutes()).padStart(2, '0');
  const ss = String(ts.getSeconds()).padStart(2, '0');
  line.textContent = `[${hh}:${mm}:${ss}] ${formatSerialLine(d)}`;
  log.appendChild(line);
  while (log.children.length > 8) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

/* ===== OLED 渲染（对齐固件 showInvalid/showTmp/showNormal）===== */
function renderOLED(d, state) {
  const body = document.getElementById('oledBody');
  const fill = document.getElementById('oledBarFill');

  if (state === 'invalid') {
    /* 对应 showInvalid：显示 Invalid */
    body.innerHTML = `<div class="oled-label">Invalid</div>`;
    fill.style.width = '0px';
  } else if (state === 'tmp') {
    /* 对应 showTmp：显示 TMP + CM（闪烁由 50ms 循环切 blank 类）*/
    body.innerHTML = `<div class="oled-label alarm">TMP</div><div class="oled-unit">CM</div>`;
    fill.style.width = getBarFill(d) + 'px';
  } else {
    /* 对应 showNormal：数值 + CM + 进度条 */
    body.innerHTML = `<div class="oled-main">${Math.round(d)}</div><div class="oled-unit">CM</div>`;
    fill.style.width = getBarFill(d) + 'px';
  }
}

/* ===== 全量刷新 UI（数据源：连固件用真实，未连用模拟 measureMedian）===== */
function updateUI() {
  const d = currentDist;
  const state = currentState;

  /* --- OLED 渲染 --- */
  renderOLED(d, currentState);

  /* --- 大数字（Web 辅助显示）--- */
  document.getElementById('distVal') && (document.getElementById('distVal').textContent =
    d >= 0 ? d.toFixed(1) : '--');

  /* --- 量程胶囊条 --- */
  const pct = d >= 0 ? Math.max(Math.min(d / MAX_RANGE * 100, 100), 1) : 0;
  document.getElementById('distBar').style.width = pct + '%';

  /* --- 报警判断（Web 增值，与固件 TMP 阈值概念对齐）--- */
  const alarm = d >= 0 && isAlarm(d, settings);
  document.getElementById('distBar').classList.toggle('alarm', alarm);

  /* --- 状态标题 --- */
  const hl = document.getElementById('headline');
  const capText = document.getElementById('oledCaptionText');
  const capDot = document.querySelector('.oled-caption .dot');
  if (currentState === 'invalid') {
    hl.className = 'headline bad';
    document.getElementById('headlineIcon').className = 'fas fa-circle-xmark';
    document.getElementById('headlineText').textContent = '无效 · 无回波或超量程';
    capText.textContent = 'Invalid · 无回波';
    capDot.className = 'dot bad';
  } else if (currentState === 'tmp') {
    hl.className = 'headline bad';
    document.getElementById('headlineIcon').className = 'fas fa-triangle-exclamation';
    document.getElementById('headlineText').textContent = 'TMP 闪烁 · 低于安全阈值';
    capText.textContent = 'TMP 闪烁 · 越近越快';
    capDot.className = 'dot bad';
  } else {
    hl.className = 'headline ' + (alarm ? 'bad' : 'ok');
    document.getElementById('headlineIcon').className =
      'fas ' + (alarm ? 'fa-triangle-exclamation' : 'fa-circle-check');
    document.getElementById('headlineText').textContent =
      alarm ? '警告 · 低于安全阈值' : '监测中 · 距离正常';
    capText.textContent = alarm ? '正常 · 报警中' : '正常 · OLED 实时显示';
    capDot.className = 'dot' + (alarm ? ' bad' : '');
  }

  /* --- 报警状态卡 --- */
  const alarmCard = document.getElementById('alarmCard');
  alarmCard.className = 'status-card ' + (alarm ? 'alarm-active' : 'alarm-ok');
  document.getElementById('alarmIcon').className =
    'fas ' + (alarm ? 'fa-triangle-exclamation' : 'fa-circle-check');
  document.getElementById('alarmDesc').textContent =
    currentState === 'invalid' ? '无效读数' : (alarm ? '低于安全阈值' : '距离正常');

  /* --- 蜂鸣器卡（Web 增值）--- */
  const bCard = document.getElementById('buzzerCard');
  const bIcon = document.getElementById('buzzerIcon');
  const bDesc = document.getElementById('buzzerDesc');
  if (settings.buzzerOn) {
    bCard.className = 'status-card buzzer-on';
    bIcon.className = 'fas fa-volume-high';
    bDesc.textContent = alarm ? '蜂鸣中…' : '已启用';
  } else {
    bCard.className = 'status-card buzzer-off';
    bIcon.className = 'fas fa-volume-xmark';
    bDesc.textContent = '已静音';
  }

  /* --- 震动卡（Web 增值）--- */
  const vCard = document.getElementById('vibrateCard');
  const vDesc = document.getElementById('vibrateDesc');
  if (settings.vibrate) {
    vCard.className = 'status-card vibrate-on';
    vDesc.textContent = alarm ? '震动中…' : '已启用';
  } else {
    vCard.className = 'status-card vibrate-off';
    vDesc.textContent = '已禁用';
  }

  /* --- 串口日志 --- */
  appendSerial(d);
}

/* ===== 模拟模式专用循环（未连固件时每秒测一次）===== */
function simTick() {
  if (Conn.isOnline()) return;           // 连固件时由 onData 驱动，不模拟
  if (!settings.sensorOn && !settings.irOn) return;
  currentDist = measureMedian();
  currentState = getDistanceState(currentDist);
  updateUI();
}
setInterval(simTick, 1000);

/* ===== 初始渲染 ===== */
refreshConnUI();
simTick();  // 首次模拟渲染（连固件后由 onData 接管）

/* ===== TMP 闪烁循环（对齐固件 showTmp 显示/空白交替）===== */
/* 每 50ms 检查一次，按 getTmpInterval(d) 计算 phase 切 blank 类 */
setInterval(() => {
  const oled = document.getElementById('oledScreen');
  if (currentState === 'tmp') {
    const interval = getTmpInterval(currentDist);
    const phase = Math.floor(Date.now() / interval) % 2;
    oled.classList.toggle('blank', phase === 1);
  } else {
    oled.classList.remove('blank');
  }
}, 50);

/* ===== 模拟模式切换 ===== */
document.querySelectorAll('#simModeRow .chip-sm').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#simModeRow .chip-sm').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    const mode = chip.dataset.mode;
    updateSetting('simMode', mode);
    setSimMode(mode);
    refreshSimUI();
  });
});

/* ===== 手动距离滑块 ===== */
document.getElementById('simDistSlider').addEventListener('input', e => {
  const v = +e.target.value;
  updateSetting('simDistance', v);
  setSimDistance(v);
  document.getElementById('simDistVal').textContent = v + ' cm';
  paintSlider(e.target, 2, 430);
});

/* ===== 测试蜂鸣（Web 增值）===== */
document.getElementById('testBtn').addEventListener('click', () => {
  const d = document.getElementById('buzzerDesc');
  d.textContent = settings.buzzerOn ? '测试蜂鸣…' : '蜂鸣器已关闭';
  setTimeout(() => { d.textContent = settings.buzzerOn ? '已启用' : '已静音'; }, 800);
});

/* ===== 测试震动（Web 增值）===== */
document.getElementById('testVibBtn').addEventListener('click', () => {
  const d = document.getElementById('vibrateDesc');
  if (settings.vibrate) {
    d.textContent = '测试震动…';
    if (navigator.vibrate) navigator.vibrate(200);
    setTimeout(() => { d.textContent = '已启用'; }, 800);
  } else {
    d.textContent = '震动已关闭';
    setTimeout(() => { d.textContent = '已禁用'; }, 800);
  }
});
</script>
</body>
</html>
