<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博主推荐详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f6f8;
            color: #222;
        }
        /* 顶部导航 */
        .navbar {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #e8e8e8;
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap:8px;
        }
        .icon-btn {
            width:32px;
            height:32px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:50%;
            background:#f3f3f3;
            cursor:pointer;
        }
        .nav-title{
            font-size:16px;
            font-weight:500;
        }
        .nav-right{
            display:flex;
            gap:12px;
        }

        .container{
            max-width:720px;
            margin:0 auto;
            padding-bottom:80px;
        }
        /* 卡片1：博主基础信息 */
        .card-author{
            background:#fff;
            margin:12px;
            border-radius:16px;
            padding:20px;
        }
        .author-head{
            display:flex;
            gap:16px;
            align-items:flex-start;
        }
        .avatar{
            width:80px;
            height:80px;
            border-radius:50%;
            object-fit:cover;
            /* 替换为你的头像地址 background:url("./avatar.jpg") center/cover; */
            background:#ddd;
            flex-shrink:0;
        }
        .author-meta{
            flex:1;
        }
        .name-row {
            position: relative;
            display: flex;
            align-items: center;
        }
        .author-name{
            font-size:20px;
            font-weight:bold;
        }
        .badge{
            position:absolute;
            right:0;
            top:50%;
            transform: translateY(-50%);
            font-size:12px;
            background:#c82423;
            color:#ffffff;
            padding:2px 8px;
            border-radius:12px;
        }
        .author-slogan{
            font-size:15px;
            font-weight:600;
            color:#222;
            margin:8px 0 14px;
        }
        /* 核心数据四宫格 */
        .data-row{
            display:grid;
            grid-template-columns: repeat(4,1fr);
            margin-top:20px;
            text-align:center;
            gap:4px;
        }
        .data-item .num{
            font-size:17px;
            font-weight:600;
        }
        .data-item .label{
            font-size:12px;
            color:#777;
            margin-top:3px;
        }

        /* 平台卡片网格 */
        .platform-wrap{
            margin:0 12px 12px;
        }
        .platform-grid{
            display:grid;
            grid-template-columns: repeat(2, 1fr);
            gap:12px;
        }
        .platform-card{
            background:#ffffff;
            border-radius:16px;
            padding:24px 16px;
            display:flex;
            align-items:center;
            justify-content:center;
            border:2px solid transparent;
            transition: border-color 0.25s ease;
            cursor:pointer;
        }
        .platform-card-text{
            font-size:15px;
            font-weight:600;
        }
        /* 各平台悬浮边框色 */
        .platform-card.douyin:hover {
            border-color:#000000;
        }
        .platform-card.kuaishou:hover {
            border-color:#ff6700;
        }
        .platform-card.bilibili:hover {
            border-color:#fb7299;
        }
        .platform-card.xiaohongshu:hover {
            border-color:#ff2442;
        }

        /*回到顶部*/
        .back-top{
            position:fixed;
            bottom:26px;
            right:20px;
            width:44px;
            height:44px;
            border-radius:50%;
            background:rgba(34,180,80,0.45);
            border:2px solid #ffffff;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            cursor:pointer;
            z-index:100;
        }
        footer{
            text-align:center;
            font-size:12px;
            color:#999;
            padding:20px 0;
        }

        /* ==================== 响应式：三端统一断点 ==================== */
        /* 平板 (768px - 1023px) */
        @media (min-width: 768px) and (max-width: 1023px) {
            .container { max-width: 720px; }
            .platform-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* 手机 (<768px) */
        @media (max-width: 767px) {
            .navbar { padding: 10px 12px; }
            .nav-title { font-size: 15px; }
            .icon-btn { width: 30px; height: 30px; font-size: 14px; }

            .container { padding: 0 10px 60px; }
            .card-author { margin: 10px; padding: 16px; border-radius: 14px; }

            .author-head { gap: 12px; }
            .avatar { width: 64px; height: 64px; }
            .author-name { font-size: 18px; }
            .badge { font-size: 11px; padding: 2px 7px; }
            .author-slogan { font-size: 14px; margin: 6px 0 12px; }

            .data-row { gap: 2px; margin-top: 16px; }
            .data-item .num { font-size: 15px; }
            .data-item .label { font-size: 11px; }

            .platform-wrap { margin: 0 10px 10px; }
            .platform-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .platform-card { padding: 20px 12px; border-radius: 14px; }
            .platform-card-text { font-size: 14px; }

            .back-top { width: 40px; height: 40px; bottom: 18px; right: 14px; font-size: 18px; }
        }

        /* 电脑 (>=1024px) */
        @media (min-width: 1024px) {
            .container { max-width: 860px; }
            .platform-grid { grid-template-columns: repeat(4, 1fr); }
            .card-author { padding: 24px; }
            .avatar { width: 90px; height: 90px; }
            .author-name { font-size: 22px; }
            .data-item .num { font-size: 18px; }
            .platform-card { padding: 28px 16px; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-left">
            <div class="icon-btn">←</div>
            <div class="nav-title">博主详情</div>
        </div>
        <div class="nav-right">
            <div class="icon-btn">⤴</div>
            <div class="icon-btn">⋯</div>
        </div>
    </div>

    <div class="container">
        <!--卡片1：博主信息-->
        <div class="card-author">
            <div class="author-head">
                <div class="avatar"></div>
                <div class="author-meta">
                    <div class="name-row">
                        <div class="author-name">南翔</div>
                        <span class="badge">非遗</span>
                    </div>
                    <div class="author-slogan">传统文化创作者，美食自媒体</div>
                </div>
            </div>
            <div class="data-row">
                <div class="data-item">
                    <div class="num">28.6w</div>
                    <div class="label">粉丝</div>
                </div>
                <div class="data-item">
                    <div class="num">326</div>
                    <div class="label">作品</div>
                </div>
                <div class="data-item">
                    <div class="num">1.2亿</div>
                    <div class="label">总播放</div>
                </div>
                <div class="data-item">
                    <div class="num">762w</div>
                    <div class="label">总获赞</div>
                </div>
            </div>
        </div>

        <!--平台卡片网格：点击卡片新标签页直接跳转链接-->
        <div class="platform-wrap">
            <div class="platform-grid">
                <div class="platform-card douyin" data-url="https://v.douyin.com/2d7L_qjU_R0/">
                    <div class="platform-card-text">抖音</div>
                </div>
                <div class="platform-card kuaishou" data-url="https://v.kuaishou.com/KZ2VZg0V">
                    <div class="platform-card-text">快手</div>
                </div>
                <div class="platform-card bilibili" data-url="https://b23.tv/yuGRoGw">
                    <div class="platform-card-text">哔哩哔哩</div>
                </div>
                <div class="platform-card xiaohongshu">
                    <div class="platform-card-text">小红书</div>
                </div>
            </div>
        </div>

        <footer>© 2026 内容推荐平台 版权所有 | 仅供阅览分享</footer>
    </div>

    <div class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

<script>
document.querySelectorAll('.platform-card[data-url]').forEach(card=>{
    card.addEventListener('click',()=>{
        window.open(card.dataset.url,"_blank");
    })
})
</script>
</body>
</html>
